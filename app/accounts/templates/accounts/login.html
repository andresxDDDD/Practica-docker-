{% extends 'base.html' %}

{% block title %}Iniciar Sesión - AgendaVoz{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-indigo-600 mb-2">AgendaVoz</h1>
        <p class="text-center text-gray-500 mb-8">Inicia sesión para continuar</p>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <input type="text" name="username" id="id_username" required
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>
            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" id="id_password" required
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>
            {% if form.errors %}
                <p class="text-red-500 text-sm">Usuario o contraseña incorrectos.</p>
            {% endif %}
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
                Iniciar Sesión
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            ¿No tienes cuenta?
            <a href="{% url 'accounts:register' %}" class="text-indigo-600 hover:underline font-medium">Regístrate</a>
        </p>
    </div>
</div>
{% endblock %}
