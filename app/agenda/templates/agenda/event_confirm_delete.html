{% extends 'base.html' %}

{% block title %}Eliminar Evento - AgendaVoz{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto text-center">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Eliminar Evento</h1>
        <p class="text-gray-500 mb-6">
            ¿Estás seguro de eliminar <strong>"{{ event.title }}"</strong>?
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="flex gap-3 justify-center">
                <button type="submit"
                        class="bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 px-6 rounded-lg transition">
                    Sí, eliminar
                </button>
                <a href="{% url 'agenda:dashboard' %}"
                   class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 px-6 rounded-lg transition">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
