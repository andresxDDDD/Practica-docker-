<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgendaVoz{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'agenda/css/output.css' %}">
    <style>
        #voice-btn.listening {
            @apply bg-red-600 hover:bg-red-700 ring-4 ring-red-300 animate-pulse;
        }
        #voice-btn.listening span {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .form-input, .form-textarea {
            @apply w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition;
        }
        .form-textarea {
            @apply resize-none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    {% if user.is_authenticated %}
    <nav class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="{% url 'agenda:dashboard' %}" class="text-xl font-bold text-indigo-600">
                AgendaVoz
            </a>
            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-500 hidden sm:inline">{{ user.username }}</span>
                <a href="{% url 'agenda:dashboard' %}"
                   class="text-sm text-gray-600 hover:text-indigo-600 transition">Mi Agenda</a>
                <form method="post" action="{% url 'accounts:logout' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit"
                            class="text-sm text-gray-500 hover:text-red-600 transition">
                        Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="max-w-5xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
